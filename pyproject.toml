[project]
name = "photo-manager"
version = "0.1.0"
description = "A Python script that uploads photos to Cloudflare R2 and Google Drive"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.162",
    "exif>=0.10.0",
    "google-api-python-client>=1.9.1",
    "google-auth-oauthlib>=0.4.1",
    "google-auth-httplib2>=0.0.3",
]
